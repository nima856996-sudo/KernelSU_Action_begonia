name: Build Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - begonia-13.0

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          echo "BUILD_TIME=$(TZ=Asia/Tehran date "+%Y%m%d%H%M")" >> $GITHUB_ENV
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev zip curl make device-tree-compiler python3 gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi
          mkdir -p $GITHUB_WORKSPACE/kernel_workspace

      - name: Download AOSP Clang 9.0.4 Toolchain
        run: |
          cd $GITHUB_WORKSPACE
          git clone https://github.com/J0SH1X/clang-r353983 clang --depth=1

      - name: Download Kernel Source
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          git clone https://github.com/ZyCromerZ/begonia -b 20210205/qk-n android-kernel --depth=1

      - name: Setup SukiSU Nova
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          git clone https://github.com/SukiSU-Nova/SukiSU-Nova KernelSU -b v3.0.0 --depth=1
          cd drivers
          ln -sf ../KernelSU/kernel kernelsu
          grep -q "kernelsu" Makefile || printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> Makefile
          grep -q "source \"drivers/kernelsu/Kconfig\"" Kconfig || sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' Kconfig
          cd ..
          python3 $GITHUB_WORKSPACE/scripts/patch_sukisu.py

      - name: Configure Kernel
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          cp $GITHUB_WORKSPACE/crdroid.config arch/arm64/configs/crdroid_defconfig
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- crdroid_defconfig
          echo "CONFIG_LITTLE_CPU_MASK=63" >> out/.config
          echo "CONFIG_BIG_CPU_MASK=192" >> out/.config
          echo "CONFIG_KSU=y" >> out/.config
          echo "CONFIG_KSU_MANUAL_SU=y" >> out/.config
          echo "CONFIG_KPM=y" >> out/.config
          echo "CONFIG_KPROBES=y" >> out/.config
          echo "CONFIG_KPROBE_EVENTS=y" >> out/.config
          echo "CONFIG_KRETPROBES=y" >> out/.config
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- olddefconfig

      - name: Build Kernel
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_COMPILER_STRING="$(clang --version | head -n 1)"
          export KBUILD_BUILD_HOST=crDroidBuild
          export KBUILD_BUILD_USER=nobody
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-w -Wno-int-conversion -Wno-incompatible-pointer-types"

      - name: Check Output
        run: |
          if [ -f $GITHUB_WORKSPACE/kernel_workspace/android-kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "Image.gz-dtb found!"
          else
            echo "Kernel Image.gz-dtb not found!"
            exit 1
          fi

      - name: Package AnyKernel3
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          git clone https://github.com/osm0sis/AnyKernel3
          cp $GITHUB_WORKSPACE/scripts/anykernel_begonia.sh AnyKernel3/anykernel.sh
          cp android-kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          rm -rf AnyKernel3/.git* AnyKernel3/README.md
          cd AnyKernel3
          zip -r9 ../SukiSU-Nova-Kernel-Begonia-crDroid.zip . -x "*.git*"
          cd ..
          sha256sum SukiSU-Nova-Kernel-Begonia-crDroid.zip > SukiSU-Nova-Kernel-Begonia-crDroid.zip.sha256

      - name: Upload AnyKernel3 Package
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Nova-Kernel-Begonia-crDroid-${{ env.BUILD_TIME }}
          path: |
            kernel_workspace/SukiSU-Nova-Kernel-Begonia-crDroid.zip
            kernel_workspace/SukiSU-Nova-Kernel-Begonia-crDroid.zip.sha256

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz-dtb-${{ env.BUILD_TIME }}
          path: kernel_workspace/android-kernel/out/arch/arm64/boot/Image.gz-dtb
